<body onload="init()">
<script>
function init() {
  // code to run on load
}
</script>
</body>

<script>
window.onload = function() {
  // runs after images/styles/fonts load
};
</script>

<script>
window.addEventListener('load', function() {
  // runs after full page load
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // runs once DOM is parsed
});
</script>

<head>
<script defer>
(function() {
  // runs after DOM parsed, like DOMContentLoaded
})();
</script>
</head>
